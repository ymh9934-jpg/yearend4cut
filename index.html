<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>연말네컷</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/*
VOICE  교회 연말 파티의 스티커사진기. 밤하늘 배경 위에 파스텔 프레임이 반짝이는, 귀엽고 따뜻한 톤.
IDEA   줄에 매달린 네컷 사진 + 스티커·펜으로 꾸미는 스티커사진기 편집 화면.
PICTURE 첫 화면: 금색 집게에 매달려 흔들리는 프레임. 꾸미기 화면: 프레임 자체가 작업대.
COLOUR 한밤의 남색→자두빛 바탕, 크림 글씨, 금색 강조. 프레임은 파스텔.
TYPE   주아(둥근 귀여운 글씨)로 제목·멘트, 고운돋움 본문.
*/
:root{--night:#0F1830;--plum:#2B1C3F;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--ink:#F7F1E3;--mute:#B9B3C9;--gold:#F2C65E;--gold2:#D39C3A;--deep:#0A1124;--pink:#FF8FB1;
  --round:"Jua","Gowun Dodum",sans-serif;--sans:"Gowun Dodum",system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font:16px/1.5 var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(120% 70% at 50% 0%,#26335F 0%,transparent 60%),linear-gradient(170deg,var(--night),var(--plum))}
button{font:inherit;color:inherit;cursor:pointer}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px)}
.screen.on{display:flex}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:28px;border:0;font-family:var(--round);font-size:20px;
  color:#3A2504;background:linear-gradient(180deg,#FCE6A8,var(--gold) 55%,var(--gold2));box-shadow:0 8px 20px rgba(211,156,58,.3),0 1px 0 rgba(255,255,255,.6) inset}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.pink{background:linear-gradient(180deg,#FFC2D6,var(--pink));color:#5A1230;box-shadow:0 8px 20px rgba(255,143,177,.3)}
.btn:disabled{opacity:.45}
.btn:active,.chip:active,.tile:active{transform:scale(.97)}
.pill{min-height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.08);padding:0 16px;font-size:15px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:8px}
.top h2{flex:1;margin:0;text-align:center;font-family:var(--round);font-weight:400;font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 15px;border-radius:22px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);font-size:15px;display:flex;align-items:center;gap:7px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(242,198,94,.12)}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
input[type=text],input[type=url]{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:inherit;font-size:17px;padding:0 14px}
input:focus{outline:none;border-color:var(--gold)}
.badge{min-width:24px;height:24px;border-radius:12px;background:var(--pink);color:#4A0F26;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-family:var(--round)}

/* 홈 */
#home{padding-left:20px;padding-right:20px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
h1{font-family:var(--round);font-weight:400;font-size:50px;line-height:1;margin:6px 0 2px;color:var(--gold);text-shadow:0 3px 0 #8A5A16,0 8px 24px rgba(242,198,94,.25)}
.sub{color:var(--mute);margin:4px 0 0;font-size:15px}
.hang{position:relative;flex:1;width:100%;margin:10px 0 14px;display:flex;justify-content:center;min-height:180px}
.hang::before{content:"";position:absolute;left:-20px;right:-20px;top:14px;height:2px;background:linear-gradient(90deg,transparent,rgba(242,198,94,.6) 20%,rgba(242,198,94,.6) 80%,transparent);transform:rotate(-1.2deg)}
.swing{position:relative;height:100%;padding-top:22px;transform-origin:50% 14px;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(1.8deg)}}
.swing canvas{display:block;height:100%;width:auto;border-radius:6px;box-shadow:0 22px 40px rgba(0,0,0,.5)}
.clip{position:absolute;left:50%;top:4px;width:34px;height:30px;margin-left:-17px;border-radius:7px;background:linear-gradient(180deg,#FBE7B0,var(--gold) 45%,var(--gold2));box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:first-child{grid-column:1/-1;min-height:86px}}
.tile{min-height:112px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px;text-align:left;position:relative}
.tile b{font-family:var(--round);font-weight:400;font-size:20px;line-height:1.2}
.tile small{color:var(--mute);font-size:13px;line-height:1.35}
.tile .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(242,198,94,.18)}
.tile.p .ic{background:rgba(255,143,177,.2)}.tile.b .ic{background:rgba(156,140,240,.22)}
.tile .badge{position:absolute;right:12px;top:12px}
.link{background:none;border:0;color:var(--mute);font-size:14px;min-height:44px;margin-top:6px;text-decoration:underline;text-underline-offset:3px}

/* 촬영 */
#shoot{background:var(--deep);padding-left:0;padding-right:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}
.dots{display:flex;gap:9px}
.dots i{width:11px;height:11px;border-radius:50%;background:#2F3757}
.dots i.done{background:var(--gold)}.dots i.now{background:var(--ink);box-shadow:0 0 0 4px rgba(247,241,227,.18)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;position:relative;min-height:0}
.vp{position:relative;overflow:hidden;border-radius:18px;background:#000;box-shadow:0 0 0 2px rgba(242,198,94,.5)}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vp video.mirror{transform:scaleX(-1)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--round);font-size:160px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.55);pointer-events:none}
.count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:.85}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.msg{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);text-align:center;background:rgba(15,24,48,.96);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.thumbs{display:flex;gap:8px;padding:12px 16px 0;justify-content:center}
.thumbs div{width:54px;aspect-ratio:4/3;border-radius:6px;background:#1A2340 center/cover;border:1.5px solid #2B3558}
.thumbs div.now{border-color:var(--ink)}
.ctrl{padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.07);border-radius:14px;padding:4px}
.seg button{min-height:42px;border:0;border-radius:11px;background:none;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--deep);font-weight:700}

/* 사진함 */
.qrbox{display:flex;gap:14px;align-items:center;background:#FFF9EE;color:#2A2140;border-radius:22px;padding:14px}
.qrbox canvas{flex:none;width:132px;height:132px;image-rendering:pixelated;border-radius:8px}
.qrbox b{font-family:var(--round);font-weight:400;font-size:20px;display:block;line-height:1.25}
.qrbox p{margin:6px 0 0;font-size:14px;color:#5A5070;line-height:1.45}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#5A5070}
.status i{width:9px;height:9px;border-radius:50%;background:#C9C2D6}
.status.ok i{background:#2FB67C}.status.err i{background:#E8505B}
.tray{flex:1;overflow-y:auto;margin:14px -4px 10px;padding:0 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;background:#1A2340 center/cover;border:2px solid transparent;padding:0}
.ph.on{border-color:var(--gold)}
.ph .n{position:absolute;left:6px;top:6px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3A2504;font-family:var(--round);font-size:18px;display:flex;align-items:center;justify-content:center}
.ph .x{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:30px;text-align:center}
.ph .from{position:absolute;left:0;right:0;bottom:0;font-size:12px;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));border-radius:0 0 10px 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 10px;font-size:15px}

/* 꾸미기 */
#edit{padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.cv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.cv canvas{touch-action:none;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;background:rgba(255,255,255,.06);border-radius:16px;padding:4px}
.tools button{min-height:48px;border:0;border-radius:12px;background:none;color:var(--mute);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0}
.tools button svg{width:20px;height:20px}
.tools button.on{background:var(--ink);color:var(--deep)}
.panel{height:150px;padding-top:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.frow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 2px}
.frow::-webkit-scrollbar{display:none}
.fr{flex:none;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.fr canvas{height:58px;width:92px;border-radius:4px;outline:2px solid transparent;outline-offset:2px}
.fr.on canvas{outline-color:var(--gold)}
.fr span{font-size:12px;color:var(--mute);white-space:nowrap}
.fr.on span{color:var(--gold)}
.colors{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px}
.colors button{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.colors button.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.stks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stks button{flex:none;width:62px;height:62px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);padding:4px;display:flex;align-items:center;justify-content:center}
.stks canvas{width:52px;height:52px}
.row{display:flex;gap:8px;align-items:center}
.row .pill{flex:none}
.hint{font-size:13px;color:var(--mute);margin:0}

/* 결과 */
.pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0 12px}
.pic img{max-height:100%;max-width:100%;border-radius:6px;box-shadow:0 18px 36px rgba(0,0,0,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 창 */
.modal{position:fixed;inset:0;background:rgba(5,8,20,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.sheet{width:100%;max-width:420px;background:#FFF9EE;color:#2A2140;border-radius:26px;padding:22px 20px;text-align:center}
.sheet h3{font-family:var(--round);font-weight:400;font-size:24px;margin:0 0 6px}
.sheet p{margin:0 0 14px;color:#5A5070;font-size:15px}
.sheet canvas{width:min(68vw,260px);height:auto;image-rendering:pixelated}
.sheet input{background:#fff;color:#2A2140;border-color:#DDD3E8}
.sheet .btn.ghost{color:#2A2140;border-color:#DDD3E8;background:#fff}
.spin{width:42px;height:42px;margin:16px auto;border-radius:50%;border:4px solid #EADFC9;border-top-color:var(--gold2);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--deep);padding:12px 20px;border-radius:24px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:40}
.toast.on{opacity:1}
@media (max-height:700px){h1{font-size:40px}.tile{min-height:96px}.panel{height:146px}}
@media (prefers-reduced-motion:reduce){.swing,.count.pop,.flash.go,.spin{animation:none}}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<section class="screen on" id="home">
  <div class="hero">
    <h1>연말네컷</h1>
    <p class="sub">찍고, 꾸미고, 나눠 가져요</p>
    <div class="hang"><div class="swing"><div class="clip"></div><canvas id="pv"></canvas></div></div>
  </div>
  <div class="tiles">
    <button class="tile" id="goShoot">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2C65E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span><b>탭으로 찍기</b><br><small>탭 카메라로 네 번 찰칵</small></span>
    </button>
    <button class="tile b" id="goPhoneCam">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8ABFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="11" height="13" rx="2"/><path d="M13 10l4-2v9l-4-2"/><path d="M19 7a5 5 0 0 1 0 10"/></svg></span>
      <span><b>폰 카메라로 찍기</b><br><small>폰 화면을 탭에서 실시간으로</small></span>
    </button>
    <button class="tile p" id="goInbox">
      <span class="badge" id="trayBadge" hidden>0</span>
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8FB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></span>
      <span><b>폰 사진 보내기</b><br><small>찍어 둔 사진을 받아서 꾸미기</small></span>
    </button>
  </div>
  <button class="link" id="openSettings">사진 QR 받기 설정</button>
</section>

<section class="screen" id="shoot">
  <div class="bar">
    <button class="pill" id="cancel">그만하기</button>
    <div class="dots" id="dots"></div>
    <div style="display:flex;gap:6px"><button class="pill" id="qrAgain" hidden>QR</button><button class="pill" id="mirrorBtn" hidden>좌우 반전</button><button class="pill" id="flip">앞뒤 전환</button></div>
  </div>
  <div class="stage">
    <div class="qrbox" id="camLink" hidden style="position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:2;flex-direction:column;text-align:center;padding:22px">
      <canvas id="qrCam" style="width:220px;height:220px"></canvas>
      <div><b id="camLinkTitle">폰 카메라로 이 QR을 찍고<br>‘카메라 켜고 연결하기’를 눌러 주세요</b>
      <p id="camLinkSub">연결되면 폰 카메라 화면이 여기에 실시간으로 나와요.</p>
      <span class="status" id="camStatus"><i></i><span>연결 준비 중</span></span></div>
    </div>
    <div class="vp" id="vp"><video id="video" playsinline muted autoplay></video><div class="count" id="count"></div></div>
    <div class="msg" id="msg" hidden><p id="msgText" style="margin:0 0 14px">카메라를 켤 수 없어요.</p><button class="btn ghost" id="msgBack">돌아가기</button></div>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="ctrl">
    <div class="seg" id="timers"></div>
    <button class="btn" id="startBtn">촬영 시작</button>
  </div>
</section>

<section class="screen" id="inbox">
  <div class="top"><button class="pill" data-back>←</button><h2>사진함</h2><button class="pill" id="clearPick">선택 해제</button></div>
  <div class="qrbox">
    <canvas id="qrSend" width="33" height="33"></canvas>
    <div>
      <b>폰 카메라로 QR을 찍고<br>사진을 보내 주세요</b>
      <p>셀카든 후면이든 자유롭게! 앱 설치 없이 아이폰·갤럭시 모두 돼요.</p>
      <span class="status" id="linkStatus"><i></i><span>연결 준비 중</span></span>
    </div>
  </div>
  <div class="tray" id="tray"></div>
  <button class="btn" id="goEdit" disabled>사진 4장을 골라 주세요</button>
</section>

<section class="screen" id="edit">
  <div class="top">
    <button class="pill" data-back>←</button>
    <button class="pill" id="undo" aria-label="되돌리기">↶ 되돌리기</button>
    <h2></h2>
    <button class="btn" id="finish" style="width:auto;min-height:44px;padding:0 20px;font-size:17px">완성</button>
  </div>
  <div class="cv" id="cvWrap"><canvas id="ed"></canvas></div>
  <div class="tools" id="tools">
    <button data-t="frame" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7" y="6" width="10" height="9" rx="1"/></svg>프레임</button>
    <button data-t="phrase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M8 19h8"/></svg>멘트</button>
    <button data-t="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>사진</button>
    <button data-t="draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>그리기</button>
    <button data-t="sticker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l2.4 5 5.6.8-4 3.9.9 5.5L12 16.6 7.1 19.2l.9-5.5-4-3.9 5.6-.8z"/></svg>스티커</button>
    <button data-t="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>글씨</button>
  </div>
  <div class="panel" id="panel"></div>
</section>

<section class="screen" id="result">
  <div class="top"><button class="pill" data-back>← 다시 꾸미기</button><h2></h2></div>
  <div class="pic"><img id="out" alt="완성된 네컷 사진"></div>
  <div class="grid2">
    <button class="btn" id="save">갤러리에 저장</button>
    <button class="btn pink" id="qrBtn">QR로 받기</button>
    <button class="btn ghost" id="share">카톡 등으로 보내기</button>

      <div class="row"><div class="seg" style="flex:1">${[[7, '얇게'], [14, '보통'], [26, '굵게']].map(([w, n]) => `<button data-w="${w}" class="${w === S.pen.w ? 'on' : ''}">${n}</button>`).join('')}</div><button class="pill" id="clrDraw">그림 지우기</button></div>`;
  } else if (t === 'sticker') {
    P.innerHTML = `<div class="stks" id="stks">${STICKERS.map(k => `<button data-stk="${k}"><canvas width="104" height="104"></canvas></button>`).join('')}</div><p class="hint">누르면 붙어요. 끌어서 옮기고, 노란 손잡이로 크기·방향, 빨간 ✕로 지워요.</p>`;
    [...$('stks').children].forEach(b => { const cv = b.querySelector('canvas'), x = cv.getContext('2d'), k = b.dataset.stk, ar = stickerAR(k), w = Math.min(84, 84 / ar); x.translate(52, 52); drawSticker(x, k, w); });
  } else if (t === 'text') {
    P.innerHTML = `<div class="row"><input type="text" id="txIn" maxlength="20" placeholder="적고 싶은 말"><button class="btn" id="txAdd" style="white-space:nowrap;flex:none;width:auto;min-height:50px;padding:0 18px;font-size:17px">붙이기</button></div><div class="colors">${PEN.map(c => `<button data-tc="${c}" class="${c === S.tcolor ? 'on' : ''}" style="background:${c}" aria-label="글씨 색"></button>`).join('')}</div>`;
    $('txAdd').onclick = () => { const v = $('txIn').value.trim(); if (!v) { $('txIn').focus(); return; } const g = geo(S.layout); const it = {type: 'txt', text: v, c: S.tcolor, x: g.W / 2, y: g.H / 2, s: 96, r: -.06}; S.items.push(it); S.sel = it; $('txIn').value = ''; $('txIn').blur(); pushHist(); paint(); };
  }
  paint();
}
$('panel').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.cat) { S.cat = d.cat; setTool('frame'); }
  else if (d.lay) { if (S.layout !== d.lay) { S.layout = d.lay; S.cuts.forEach(c => { c.ox = c.oy = 0; }); const g = geo(S.layout); S.items.forEach(it => { it.x = Math.min(it.x, g.W - 40); it.y = Math.min(it.y, g.H - 40); }); remember(); pushHist(); fitEditor(); setTool('frame'); } }
  else if (d.th) { if (d.th === S.theme && d.th === 'fortune') { S.fortune = FORTUNES[(FORTUNES.indexOf(S.fortune) + 1 + Math.floor(Math.random() * (FORTUNES.length - 1))) % FORTUNES.length]; toast('운세를 새로 뽑았어요'); } S.theme = d.th; remember(); pushHist(); [...$('frow').children].forEach(x => x.classList.toggle('on', x === b)); fitEditor(); }
  else if (d.ph !== undefined) { S.phrase = d.ph; remember(); pushHist(); setTool('phrase'); }
  else if (b.id === 'dateT') { S.showDate = !S.showDate; remember(); pushHist(); setTool('phrase'); }
  else if (d.flt) { S.filter = d.flt; pushHist(); setTool('photo'); }
  else if (b.id === 'resetPh') { S.cuts.forEach(c => { c.zoom = 1; c.ox = c.oy = 0; }); pushHist(); paint(); }
  else if (d.pen) { S.pen.c = d.pen; setTool('draw'); }
  else if (d.w) { S.pen.w = +d.w; setTool('draw'); }
  else if (b.id === 'clrDraw') { if (S.strokes.length) { S.strokes = []; pushHist(); paint(); } }
  else if (d.stk) { const g = geo(S.layout), n = S.items.length, cut = g.cuts[n % 4]; const it = {type: 'stk', k: d.stk, x: cut.x + cut.w * (.25 + Math.random() * .5), y: cut.y + cut.h * (.3 + Math.random() * .4), s: d.stk.startsWith('d-') ? 360 : d.stk.startsWith('c-') ? 260 : BUBBLES[d.stk] ? 320 : 190, r: (Math.random() - .5) * .3}; S.items.push(it); S.sel = it; pushHist(); paint(); }
  else if (d.tc) { S.tcolor = d.tc; if (S.sel && S.sel.type === 'txt') { S.sel.c = d.tc; pushHist(); } [...b.parentNode.children].forEach(x => x.classList.toggle('on', x === b)); paint(); }
};
$('finish').onclick = () => { S.sel = null; go('result'); };

/* ===== 폰트 ===== */
function fontCheck() {
  try {
    const txt = [S.phrase, S.title, ...S.items.filter(i => i.type === 'txt').map(i => i.text), '0123456789.·'].join('');
    if (!document.fonts.check('40px Jua', txt)) document.fonts.load('40px Jua', txt).then(() => { if (current === 'edit') paint(); if (current === 'home') drawHome(); });
  } catch (e) {}
}

/* ===== 결과 ===== */
const outCv = document.createElement('canvas');
function finalData() { render(outCv, EXPORT_SCALE); return outCv.toDataURL('image/jpeg', .92); }
function drawResult() { render(outCv, .5); $('out').src = outCv.toDataURL('image/jpeg', .85); }
function fileName() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `연말네컷_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`; }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
$('save').onclick = () => {
  const data = finalData(), name = fileName();
  if (window.PhotoSaver) { const r = window.PhotoSaver.save(data, name); toast(r === 'ok' ? '갤러리 › 연말네컷 앨범에 저장했어요' : '저장하지 못했어요: ' + r.replace('error:', '')); }
  else { const a = document.createElement('a'); a.href = data; a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('사진을 내려받았어요'); }
};
$('share').onclick = () => {
  const data = finalData(), name = fileName();
  if (window.PhotoSaver) { const r = window.PhotoSaver.share(data, name); if (r !== 'ok') toast('보내지 못했어요: ' + r.replace('error:', '')); }
  else toast('앱에서만 보낼 수 있어요');
};
$('again').onclick = () => { S.pick = []; S.cuts = [null, null, null, null]; go('home'); };

/* QR로 받기 */
function modal(html) { $('sheet').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; }
$('modal').onclick = e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); };
function showDownloadQR(id) {
  const url = `${PAGES}p.html?id=${encodeURIComponent(id)}`;
  modal(`<h3>QR을 찍어 사진 받기</h3><p>휴대폰 기본 카메라로 찍으면 사진 저장 화면이 열려요.</p><canvas id="dlQR"></canvas><button class="btn" data-close style="margin-top:14px">닫기</button>`);
  drawQRTo($('dlQR'), url, 2);
}
$('qrBtn').onclick = async () => {
  if (!S.share) { openSettings(true); return; }
  if (S.uploaded) return showDownloadQR(S.uploaded);
  modal(`<h3>사진 올리는 중</h3><p>잠깐만 기다려 주세요.</p><div class="spin"></div>`);
  try {
    const data = finalData().split(',')[1];
    const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 60000);
    const r = await fetch(S.share, {method: 'POST', body: JSON.stringify({name: fileName(), data}), signal: ctrl.signal});
    clearTimeout(tm);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '서버 오류');
    S.uploaded = j.id; showDownloadQR(j.id);
  } catch (e) {
    modal(`<h3>올리지 못했어요</h3><p>${esc(e.name === 'AbortError' ? '시간이 너무 오래 걸렸어요. 인터넷 연결을 확인해 주세요.' : (e.message || '인터넷 연결이나 설정 주소를 확인해 주세요.'))}</p><button class="btn" id="retryUp">다시 시도</button><button class="btn ghost" data-close style="margin-top:10px">닫기</button>`);
    $('retryUp').onclick = () => $('qrBtn').onclick();
  }
};

/* 설정 */
function openSettings(fromQR) {
  modal(`<h3>사진 QR 받기 설정</h3><p>${fromQR ? '먼저 사진을 올릴 주소를 넣어 주세요. ' : ''}구글 Apps Script 웹 앱 주소(…/exec)를 붙여 넣어요.</p>
    <input type="url" id="shareIn" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.share)}">
    <p id="shareMsg" style="margin:10px 0 0;min-height:22px"></p>
    <div class="grid2" style="margin-top:6px"><button class="btn ghost" id="shareTest">연결 확인</button><button class="btn" id="shareSave">저장</button></div>
    <button class="btn ghost" data-close style="margin-top:10px">닫기</button>`);
  $('shareSave').onclick = () => { S.share = $('shareIn').value.trim(); remember(); closeModal(); toast('저장했어요'); };
  $('shareTest').onclick = async () => {
    const u = $('shareIn').value.trim(); $('shareMsg').textContent = '확인 중…';
    try { const j = await (await fetch(u)).json(); $('shareMsg').textContent = j.ok ? '연결됐어요! 저장을 눌러 주세요.' : '주소는 열리지만 응답이 이상해요.'; }
    catch (e) { $('shareMsg').textContent = '연결되지 않아요. 주소와 배포 설정(모든 사용자)을 확인해 주세요.'; }
  };
}
$('openSettings').onclick = () => openSettings(false);

/* ===== 시작 ===== */
if (location.hash && location.hash !== '#home') history.replaceState(null, '', location.pathname);
show('home');
imgReady.then(() => { if (current === 'home') drawHome(); });
if (document.fonts) Promise.all([document.fonts.load('40px Jua', 'Happy 2027 THE 다붓 연말네컷'), document.fonts.load('20px "Gowun Dodum"', '가')]).then(() => { if (current === 'home') drawHome(); }).catch(() => {});
}
</script>
</body>
</html>
